[project]
name = "ghcn-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tensorflow>=2.16",
    "keras-tuner>=1.4",
    "mlforecast>=0.13",
    "lightgbm>=4.3",
    "chronos-forecasting>=1.4",
    "folium>=0.16",
    "requests>=2.32",
    "tqdm>=4.66",
    "urllib3>=2.2",
    "joblib>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghcn_analysis"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "jupyter>=1.1",
    "ipykernel>=6",
    "responses>=0.25",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
